</head>
<body>
    

    <script>
        var englishMarks = +prompt("Enter your english marks:")
        var mathsMarks = +prompt("Enter your maths marks:")
        var urduMarks = +prompt("Enter your urdu marks:")
        var computerMarks = +prompt("Enter your computer marks:")
        var scienceMarks = +prompt("Enter your science marks:")
        var obtainedMarks = englishMarks + mathsMarks + urduMarks + computerMarks + scienceMarks
        var totalMarks = 500
        var percentage = (obtainedMarks / totalMarks) *100

        console.log(englishMarks);
        console.log(mathsMarks);
        console.log(urduMarks);
        console.log(computerMarks);
        console.log(scienceMarks);
        console.log(obtainedMarks);
        console.log(totalMarks);
        console.log(percentage);

        alert(`
            Total marks: ${obtainedMarks} / ${totalMarks}
            Percentage: ${percentage}%
        `)
        
    </script>
